<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快递哪去了？</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background-color: #2c3e50; display: flex; flex-direction: column; align-items: center; font-family: 'Microsoft YaHei', sans-serif; user-select: none; padding-top: 20px; }
        .game-title { color: #f39c12; font-size: 36px; font-weight: 900; margin: 0 0 15px 0; text-shadow: 2px 2px 0px #d35400, 4px 4px 0px #000; letter-spacing: 4px; }
        #game-info { width: 520px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; background: #ecf0f1; border-radius: 8px; border: 4px solid #5d4037; box-sizing: border-box; }
        .rule-item { font-size: 13px; color: #333; line-height: 1.5; border-left: 4px solid #d35400; padding-left: 8px; display: flex; align-items: center; }
        #game-container { margin-top: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: crosshair; position: relative; width: 520px; height: 620px; background: #34495e; }
        .auto-mark-row { width: 520px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auto-mark-row label { color: #ecf0f1; font-size: 15px; cursor: pointer; user-select: none; }
        .auto-mark-row input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: #f39c12; }
        @media (max-width: 560px) {
            body { padding-top: 6px; }
            .game-title { font-size: clamp(16px, 5vw, 36px); margin-bottom: 6px; }
            #game-info, .auto-mark-row { width: 92vw; max-width: 520px; }
            #game-info { padding: 8px; gap: 4px; }
            .rule-item { font-size: clamp(8px, 2.4vw, 13px); }
            .auto-mark-row label { font-size: clamp(10px, 2.8vw, 15px); }
            .auto-mark-row { margin-top: 6px; }
            #game-container {
                width: 92vw;
                aspect-ratio: 520 / 620;
                max-width: 520px;
                max-height: calc(100vh - 180px);
                margin-top: 8px;
            }
            #game-container canvas { width: 100% !important; height: 100% !important; }
        }
    </style>
</head>
<body>

<h1 class="game-title">快递哪去了？</h1>

<div id="game-info">
    <div class="rule-item">每行，每列<br>有且仅有一个快递</div>
    <div class="rule-item">每种颜色<br>有且仅有一个快递</div>
    <div class="rule-item">快递与快递之间<br>互不相邻</div>
</div>

<div class="auto-mark-row">
    <label><input type="checkbox" id="auto-mark-cb"> 自动标注（点开快递时，自动标记同行/列/邻域为非快递）</label>
</div>

<div id="game-container"></div>

<script>
const SIZE = 10;

// 生成满足「每行/列各一个、8 方向不相邻」的快递位置
function findStars() {
    const board = Array(SIZE).fill(-1);
    const safe = (r, c) => {
        for (let pr = 0; pr < r; pr++) {
            const pc = board[pr];
            if (pc === c || (Math.abs(pr - r) <= 1 && Math.abs(pc - c) <= 1)) return false;
        }
        return true;
    };
    const solve = (row) => {
        if (row === SIZE) return true;
        const cols = [...Array(SIZE).keys()].sort(() => Math.random() - 0.5);
        for (const col of cols) {
            if (safe(row, col)) {
                board[row] = col;
                if (solve(row + 1)) return true;
                board[row] = -1;
            }
        }
        return false;
    };
    solve(0);
    return board.map((col, row) => [row, col]);
}

// 两轮扩散法：第一轮每区域只扩散 1 格（控制速度不包围），第二轮按序号补充
function genRegionsChain(stars) {
    const n = SIZE;
    const region = Array.from({ length: n }, () => Array(n).fill(-1));
    const excluded = Array.from({ length: n }, () => Array(n).fill(false));
    const marker = Array.from({ length: n }, () => Array(n).fill(-1));
    const visited = new Array(n).fill(false);
    const order = [];
    // 启动孤点（不扩散，作为推理锚点）
    let cur = Math.floor(Math.random() * n);
    order.push(cur); visited[cur] = true;
    const [r0, c0] = stars[cur];
    region[r0][c0] = cur;
    for (let i = 0; i < n; i++) { excluded[r0][i] = true; excluded[i][c0] = true; }
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r0 + dr, nc = c0 + dc;
        if (nr >= 0 && nr < n && nc >= 0 && nc < n) excluded[nr][nc] = true;
    }
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (excluded[r][c]) marker[r][c] = 1;
    // 第一轮：后续每区域只扩散 1 格
    let step = 1;
    while (order.length < n) {
        step++;
        const candidates = [];
        for (let i = 0; i < n; i++) {
            if (visited[i]) continue;
            const [cr, cc] = stars[i];
            let adj = false;
            for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                const nr = cr + dr, nc = cc + dc;
                if (nr >= 0 && nr < n && nc >= 0 && nc < n && excluded[nr][nc] && region[nr][nc] === -1) { adj = true; break; }
            }
            if (adj) candidates.push(i);
        }
        let next;
        if (candidates.length) next = candidates[Math.floor(Math.random() * candidates.length)];
        else { for (let i = 0; i < n; i++) if (!visited[i]) { next = i; break; } }
        order.push(next); visited[next] = true;
        cur = next;
        const [cr, cc] = stars[cur];
        region[cr][cc] = cur;
        for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
            const nr = cr + dr, nc = cc + dc;
            if (nr >= 0 && nr < n && nc >= 0 && nc < n && region[nr][nc] === -1 && excluded[nr][nc]) { region[nr][nc] = cur; break; }
        }
        for (let i = 0; i < n; i++) { excluded[cr][i] = true; excluded[i][cc] = true; }
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const nr = cr + dr, nc = cc + dc;
            if (nr >= 0 && nr < n && nc >= 0 && nc < n) excluded[nr][nc] = true;
        }
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (excluded[r][c] && marker[r][c] === -1) marker[r][c] = step;
    }
    // 第二轮：分配到「序号 > marker」的区域（推理时会被排除），选相对大不是最大
    let changed = true;
    while (changed) {
        changed = false;
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
            if (region[r][c] !== -1) continue;
            const m = marker[r][c] || 0;
            let bestRid = -1, bestOrder = 999;
            for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < n && nc >= 0 && nc < n && region[nr][nc] !== -1) {
                    const ridOrder = order.indexOf(region[nr][nc]);
                    if (ridOrder > m && ridOrder < bestOrder) { bestOrder = ridOrder; bestRid = region[nr][nc]; }
                }
            }
            if (bestRid === -1) {
                for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < n && nc >= 0 && nc < n && region[nr][nc] !== -1) { bestRid = region[nr][nc]; break; }
                }
            }
            if (bestRid !== -1) { region[r][c] = bestRid; changed = true; }
        }
    }
    return region;
}

// 验证能否仅靠确定性逻辑规则（唯一候选 + 锁定/指向 + 邻域排除）推出唯一解
function isLogicallySolvable(mapping) {
    const n = SIZE;
    const cand = Array.from({ length: n }, () => Array(n).fill(true));
    const placed = new Set();

    const rows = Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => [r, c]));
    const cols = Array.from({ length: n }, (_, c) => Array.from({ length: n }, (_, r) => [r, c]));
    const regions = [];
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            (regions[mapping[r][c]] = regions[mapping[r][c]] || []).push([r, c]);
        }
    }

    const exclude = (cells, r, c) => {
        let ch = false;
        for (const [rr, cc] of cells) {
            if ((rr !== r || cc !== c) && cand[rr][cc]) { cand[rr][cc] = false; ch = true; }
        }
        return ch;
    };
    const place = (r, c) => {
        const key = r + ',' + c;
        if (placed.has(key)) return false;
        placed.add(key);
        let ch = false;
        ch = exclude(rows[r], r, c) || ch;
        ch = exclude(cols[c], r, c) || ch;
        ch = exclude(regions[mapping[r][c]], r, c) || ch;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < n && nc >= 0 && nc < n && cand[nr][nc]) { cand[nr][nc] = false; ch = true; }
            }
        }
        return ch;
    };

    let changed = true;
    while (changed) {
        changed = false;
        for (let r = 0; r < n; r++) {
            const cs = [];
            for (let c = 0; c < n; c++) if (cand[r][c]) cs.push(c);
            if (cs.length === 1 && place(r, cs[0])) changed = true;
        }
        for (let c = 0; c < n; c++) {
            const rs = [];
            for (let r = 0; r < n; r++) if (cand[r][c]) rs.push(r);
            if (rs.length === 1 && place(rs[0], c)) changed = true;
        }
        for (let rid = 0; rid < n; rid++) {
            const cc = regions[rid].filter(([r, c]) => cand[r][c]);
            if (cc.length === 1 && place(cc[0][0], cc[0][1])) changed = true;
        }
        for (let rid = 0; rid < n; rid++) {
            const cc = regions[rid].filter(([r, c]) => cand[r][c]);
            if (cc.length <= 1) continue;
            const rSet = new Set(cc.map(([r]) => r));
            if (rSet.size === 1) {
                const r0 = [...rSet][0];
                for (let c = 0; c < n; c++) {
                    if (mapping[r0][c] !== rid && cand[r0][c]) { cand[r0][c] = false; changed = true; }
                }
            }
            const cSet = new Set(cc.map(([, c]) => c));
            if (cSet.size === 1) {
                const c0 = [...cSet][0];
                for (let r = 0; r < n; r++) {
                    if (mapping[r][c0] !== rid && cand[r][c0]) { cand[r][c0] = false; changed = true; }
                }
            }
        }
        for (let r = 0; r < n; r++) {
            const cs = [];
            for (let c = 0; c < n; c++) if (cand[r][c]) cs.push(c);
            if (cs.length <= 1) continue;
            const rids = new Set(cs.map((c) => mapping[r][c]));
            if (rids.size === 1) {
                const rid = [...rids][0];
                for (const [rr, cc] of regions[rid]) {
                    if (rr !== r && cand[rr][cc]) { cand[rr][cc] = false; changed = true; }
                }
            }
        }
        for (let c = 0; c < n; c++) {
            const rs = [];
            for (let r = 0; r < n; r++) if (cand[r][c]) rs.push(r);
            if (rs.length <= 1) continue;
            const rids = new Set(rs.map((r) => mapping[r][c]));
            if (rids.size === 1) {
                const rid = [...rids][0];
                for (const [rr, cc] of regions[rid]) {
                    if (cc !== c && cand[rr][cc]) { cand[rr][cc] = false; changed = true; }
                }
            }
        }
    }
    return placed.size === n;
}

// 同步生成一个逻辑可解的谜题
function generatePuzzle() {
    while (true) {
        const stars = findStars();
        for (let i = 0; i < 100; i++) {
            const mapLayout = genRegionsChain(stars);
            if (isLogicallySolvable(mapLayout)) {
                const solutionMask = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
                stars.forEach(([r, c]) => { solutionMask[r][c] = true; });
                return { solutionMask, mapLayout };
            }
        }
    }
}

// --- Phaser 游戏逻辑 ---
class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }

    preload() {
        let pkg = this.make.graphics({x: 0, y: 0, add: false});
        pkg.fillStyle(0xd35400, 1);
        pkg.fillRect(8, 12, 30, 22);
        pkg.lineStyle(2, 0x333333, 0.5);
        pkg.strokeRect(10, 14, 26, 18);
        pkg.generateTexture('package', 46, 46);
    }

    create() {
        this.errors = 0; this.found = 0; this.isGameOver = false;
        this.isDragging = false; this.dragMode = null; this.dragAxis = null;
        this.startGridX = -1; this.startGridY = -1;
        this.autoMark = document.getElementById('auto-mark-cb').checked;
        document.getElementById('auto-mark-cb').onchange = (e) => { this.autoMark = e.target.checked; };

        this.levelData = generatePuzzle();
        this.initGame();
    }

    initGame() {
        const CONFIG = {
            gridSize: 10, tileSize: 46, gap: 2, frameSize: 20,
            colors: [0xff9aa2, 0xffb7b2, 0xffdac1, 0xe2f0cb, 0xb5ead7, 0xc7ceea, 0xafcbff, 0x85e3ff, 0xf3d1f4, 0x95afc0],
            lineColor: 0x3e2723, woodColor: 0x5d4037, maxErrors: 3
        };

        this.input.on('pointerup', () => { this.isDragging = false; this.dragMode = null; this.dragAxis = null; });
        
        // 绘制
        const boardSize = CONFIG.gridSize * (CONFIG.tileSize + CONFIG.gap) + CONFIG.gap;
        const totalSize = boardSize + CONFIG.frameSize * 2;
        this.add.rectangle(totalSize/2, totalSize/2, totalSize, totalSize, CONFIG.woodColor);
        this.add.rectangle(totalSize/2, totalSize/2, boardSize, boardSize, CONFIG.lineColor);

        // 棋盘渲染
        const startPos = CONFIG.frameSize + CONFIG.gap;
        for (let y = 0; y < CONFIG.gridSize; y++) {
            for (let x = 0; x < CONFIG.gridSize; x++) {
                const xPos = startPos + x * (CONFIG.tileSize + CONFIG.gap) + CONFIG.tileSize/2;
                const yPos = startPos + y * (CONFIG.tileSize + CONFIG.gap) + CONFIG.tileSize/2;
                const container = this.add.container(xPos, yPos);
                const colorIdx = this.levelData.mapLayout[y][x];
                const bg = this.add.rectangle(0, 0, CONFIG.tileSize, CONFIG.tileSize, CONFIG.colors[colorIdx]).setInteractive();
                
                const userMark = this.add.text(0, 0, 'X', { color: '#000', alpha: 0.3, fontSize: '24px' }).setOrigin(0.5).setVisible(false);
                const failMark = this.add.text(0, 0, 'X', { color: '#000', fontSize: '32px', fontStyle: 'bold' }).setOrigin(0.5).setVisible(false);
                const pkgIcon = this.add.image(0, 0, 'package').setVisible(false);
                const errorBorder = this.add.graphics().lineStyle(4, 0xff0000, 1).strokeRect(-CONFIG.tileSize/2, -CONFIG.tileSize/2, CONFIG.tileSize, CONFIG.tileSize).setVisible(false);

                container.add([bg, userMark, failMark, pkgIcon, errorBorder]);
                let cellData = { gx: x, gy: y, opened: false, marked: false, isPackage: this.levelData.solutionMask[y][x], userMark, failMark, pkgIcon, errorBorder, lastClickTime: 0 };
                if (!this.cells) this.cells = Array.from({ length: CONFIG.gridSize }, () => Array(CONFIG.gridSize).fill(null));
                this.cells[y][x] = cellData;

                bg.on('pointerdown', () => {
                    if (this.isGameOver || cellData.opened) return;
                    const now = this.time.now;
                    if (now - cellData.lastClickTime < 300) {
                        this.handleOpen(cellData);
                        this.isDragging = false;
                    } else {
                        cellData.marked = !cellData.marked;
                        cellData.userMark.setVisible(cellData.marked);
                        this.isDragging = true;
                        this.dragMode = cellData.marked ? 'add' : 'remove';
                        this.startGridX = x; this.startGridY = y; this.dragAxis = null;
                    }
                    cellData.lastClickTime = now;
                });

                bg.on('pointerover', () => {
                    if (!this.isDragging || cellData.opened || this.isGameOver) return;
                    if (!this.dragAxis) {
                        if (x !== this.startGridX) this.dragAxis = 'row';
                        else if (y !== this.startGridY) this.dragAxis = 'col';
                    }
                    if ((this.dragAxis === 'row' && y === this.startGridY) || (this.dragAxis === 'col' && x === this.startGridX)) {
                        cellData.marked = (this.dragMode === 'add');
                        cellData.userMark.setVisible(cellData.marked);
                    }
                });
            }
        }

        // UI
        const uiY = boardSize + CONFIG.frameSize * 2 + 25;
        this.progressText = this.add.text(20, uiY, '', { fontSize: '20px', color: '#ecf0f1', fontStyle: 'bold' });
        this.errorIcons = [];
        for(let i=0; i<3; i++) {
            this.errorIcons.push(this.add.text(380 + i*35, uiY - 5, 'X', { fontSize: '28px', color: '#95a5a6' }));
        }
        this.updateStats();
    }

    handleOpen(cell) {
        if (cell.opened) return;
        cell.opened = true; cell.marked = false; cell.userMark.setVisible(false);
        if (cell.isPackage) {
            cell.pkgIcon.setVisible(true); this.found++;
            // 自动标注：同行/同列/8 邻域/同色区域标记为非快递
            if (this.autoMark) {
                const n = 10;
                const myRegion = this.levelData.mapLayout[cell.gy][cell.gx];
                for (let r = 0; r < n; r++) {
                    for (let c = 0; c < n; c++) {
                        const other = this.cells[r][c];
                        if (!other || other.opened) continue;
                        const sameRow = r === cell.gy;
                        const sameCol = c === cell.gx;
                        const neighbor = Math.abs(r - cell.gy) <= 1 && Math.abs(c - cell.gx) <= 1;
                        const sameRegion = this.levelData.mapLayout[r][c] === myRegion;
                        if ((sameRow || sameCol || neighbor || sameRegion) && !other.marked) {
                            other.marked = true;
                            other.userMark.setVisible(true);
                        }
                    }
                }
            }
        }
        else { cell.failMark.setVisible(true); cell.errorBorder.setVisible(true); this.errors++; }
        this.updateStats();
        if (this.found === 10) this.showEnd("恭喜你找到了所有的快递！", 0x2ecc71);
        else if (this.errors >= 3) this.showEnd("任务失败：快递丢了！", 0xe74c3c);
    }

    updateStats() {
        this.progressText.setText(`剩余快递: ${10 - this.found}`);
        for(let i=0; i<this.errors; i++) if(this.errorIcons[i]) this.errorIcons[i].setColor('#e74c3c');
    }

    showEnd(msg, color) {
        this.isGameOver = true;
        const totalSize = 520;
        const centerX = 260;
        this.add.rectangle(centerX, centerX, 420, 180, 0x000000, 0.9).setDepth(100).setStrokeStyle(4, 0x5d4037);
        this.add.text(centerX, centerX - 30, msg, { fontSize: '28px', color: '#fff', fontWeight: 'bold' }).setOrigin(0.5).setDepth(101);
        const btn = this.add.rectangle(centerX, centerX + 45, 180, 50, color).setInteractive({useHandCursor:true}).setDepth(101);
        this.add.text(centerX, centerX + 45, "下一局", { fontSize: '22px', color: '#fff' }).setOrigin(0.5).setDepth(102);
        btn.on('pointerdown', () => this.scene.restart());
    }
}

const config = { type: Phaser.AUTO, width: 520, height: 620, parent: 'game-container', backgroundColor: '#2c3e50', scene: MainScene, scale: { mode: Phaser.Scale.FIT } };
window.game = new Phaser.Game(config);
</script>
</body>
</html>
