<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动物消除 · Phaser 4</title>
<style>
body { margin: 0; background: #d0d0d0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
#game { background: #e8e8e8; }
canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<div id="game"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js" integrity="sha384-kyUQ5+cxc6+X89xEG6DhcXLcDU9T3Z+o/45VdT6pgAwtG6gxtAzYTEn0Wwj/BKZd" crossorigin="anonymous"></script>
<script src="bfs.js"></script>
<script>
'use strict';

// ============ 配置（初始值，启动后由图片决定） ============
let COLS = 30, ROWS = 30;
let CELL = 8;
const BLANK_ROWS = 2;
const TARGET_W = 800;      // 棋盘目标宽度（像素），格子大小按此缩放
let BOARD_MAX_DIM = 30;    // 棋盘尺寸上限（最长边）
let CANVAS_W = 800;
let CANVAS_H = 1080;
// 移动端（触摸设备）UI 放大倍数，桌面端为 1
const UI_SCALE = (typeof window !== 'undefined' && 'ontouchstart' in window) ? 1.5 : 1;
// 棋盘左右边距（像素）
const BOARD_MARGIN = Math.round(20 * UI_SCALE);
// 棋盘顶部边距（仅留少量呼吸空间，设置按钮已移到左下角）
const TOP_MARGIN = Math.round(20 * UI_SCALE);
// 盘子半径（直径占槽位 60%，圆形盘子）
function plateRadius() { return Math.round(COLS * CELL / 6 * 0.3); }

let COLORS = [
  0xd34545, 0xd37a45, 0xd3b045, 0xc2d345,
  0x8cd345, 0x57d345, 0x45d369, 0x45d39e,
  0x45d3d3, 0x459ed3, 0x4569d3, 0x5745d3,
  0x8c45d3, 0xc245d3, 0xd345b0, 0xd3457a,
];
let DARK_COLORS = [
  0xa93737, 0xa96137, 0xa88c37, 0x9ba837,
  0x70a837, 0x45a837, 0x37a854, 0x37a87e,
  0x37a8a8, 0x377ea8, 0x3754a8, 0x4537a8,
  0x7037a8, 0x9b37a8, 0xa8378c, 0xa83761,
];

// 随机打乱调色板顺序：主色 COLORS 与深色边框 DARK_COLORS 保持一一对应
function shuffleColors() {
  const pairs = COLORS.map((c, i) => [c, DARK_COLORS[i]]);
  shuffle(pairs);
  for (let i = 0; i < pairs.length; i++) {
    COLORS[i] = pairs[i][0];
    DARK_COLORS[i] = pairs[i][1];
  }
}
shuffleColors();

let PLATE_COLS = [8, 24, 40, 56, 72, 88];
let UI_Y = TOP_MARGIN + (ROWS + BLANK_ROWS) * CELL;

// DiceBear 风格列表（每次开局随机选一种）
const DICEBEAR_STYLES = ['pixel-art', 'pixel-art-neutral', 'shapes', 'shape-grid', 'disco', 'triangles', 'rings'];
function randomDiceBearUrl() {
  const style = DICEBEAR_STYLES[Math.floor(Math.random() * DICEBEAR_STYLES.length)];
  const seed = Math.random().toString(36).slice(2);
  return 'https://api.dicebear.com/9.x/' + style + '/png?seed=' + seed + '&size=100';
}

// ============ 游戏状态 ============
let grid = [];
let plateBFS = [];
let movingAnimals = [];
let flyingFoods = [];
let queues, plates;
let bfsPending = false;
let gameRunning = false;
let foodSeq = 0;
let remainingAnimals = 0;   // 剩余未消除动物数（供 checkGameOver 使用，避免每帧全网格扫描）
let dirtyCells = [];        // 动物离场后需重绘为空白格的格子

// ============ 棋盘生成 ============
function generateGrid() {
  // 默认图块，启动后会被图片覆盖
  grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      grid[r][c] = Math.floor(Math.random() * COLORS.length);
}
generateGrid();

// ============ 食物系统 ============
function countAnimals() {
  const counts = Array(COLORS.length).fill(0);
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      counts[grid[r][c]]++;
  return counts;
}

function generateFoods(animalCounts) {
  const allFoods = [];
  for (let color = 0; color < COLORS.length; color++) {
    const count = animalCounts[color];
    let total = 0;
    while (total < count) {
      const remaining = count - total;
      const cap = remaining <= 50 ? remaining : 30 + Math.floor(Math.random() * 21);
      allFoods.push({ color, capacity: cap, remaining: cap, attracted: 0, plateIndex: -1, active: false });
      total += cap;
    }
  }
  return allFoods;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function distributeToQueues(allFoods) {
  shuffle(allFoods);
  const q = [[], [], [], []];
  for (let i = 0; i < allFoods.length; i++) q[i % 4].push(allFoods[i]);
  return q;
}

// ============ BFS 已收敛到 bfs.js 的 BFS 类，通过全局 plateBFS 数组按盘子下标调用 ============

function markBlankBroadcast(row, col) {
  plateBFS.forEach(b => b.markBlank(row, col));
}

function triggerBFS() {
  if (!bfsPending) { bfsPending = true; doBFS(); }
}

function doBFS() {
  bfsPending = false;
  const activeFoods = plates.filter(p => p !== null && p.active);
  if (activeFoods.length === 0) return;
  // 每个颜色只保留最早放置（FIFO）且仍需派发的食物；已派发足够动物（available <= 0）的跳过，让同色下一个顶上
  const earliestByColor = new Map();
  for (const food of activeFoods) {
    if (food.remaining - food.attracted <= 0) continue;
    const cur = earliestByColor.get(food.color);
    if (!cur || food.seq < cur.seq) earliestByColor.set(food.color, food);
  }
  const foods = [...earliestByColor.values()];
  // 优先填满剩余最少的食物
  foods.sort((a, b) => a.remaining - b.remaining);
  let anyNew = false;
  for (const food of foods) {
    if (food.remaining <= 0) continue;
    const b = plateBFS[food.plateIndex];
    if (!b.hasAnimals(food.color)) continue;
    const available = food.remaining - food.attracted;
    if (available <= 0) continue;
    const animals = b.take(food.color, available);
    anyNew = true;
    food.attracted += animals.length;
    animals.sort((a, b) => a.distance - b.distance);
    for (const att of animals) {
      const rawPath = b.tracePath(att.row, att.col);
      rawPath.shift();                        // 去掉动物自身格
      const path = b.smoothPath(rawPath);     // 字符串拉紧成任意角度直线段
      if (path.length > 0) path[path.length - 1].isFood = true;
      grid[att.row][att.col] = -1;
      remainingAnimals--;
      dirtyCells.push({ row: att.row, col: att.col });
      markBlankBroadcast(att.row, att.col);
      movingAnimals.push({
        color: food.color, originRow: att.row, originCol: att.col,
        x: BOARD_MARGIN + att.col * CELL + CELL / 2,          // 连续像素坐标，起点在动物格中心
        y: TOP_MARGIN + att.row * CELL + CELL / 2,
        path: path,
        speed: TARGET_W / 30 * 0.5,           // 屏幕绝对速度（像素/基准帧），不随棋盘大小变化
        targetFood: food,
      });
    }
  }
  if (anyNew) triggerBFS();
}

// ============ Phaser 场景 ============
class GameScene extends Phaser.Scene {
  constructor() {
    super({ key: 'GameScene' });
  }

  create() {
    // 创建图形层
    // 棋盘烘焙到离屏纹理（boardImg），动物层与 UI 层仍用 Graphics 逐帧绘制
    this.boardImg = null;
    this.boardTex = null;
    this.animalGfx = this.add.graphics();
    this.uiGfx = this.add.graphics();
    // 木纹边框（4 条 tileSprite，置于棋盘之下）
    this.makeWoodTexture();
    this.borderTiles = [];
    for (let i = 0; i < 4; i++) {
      this.borderTiles.push(this.add.tileSprite(0, 0, 1, 1, 'wood').setOrigin(0, 0).setDepth(-1));
    }
    this.msgText = this.add.text(CANVAS_W / 2, CANVAS_H / 2 - Math.round(32 * UI_SCALE), '', {
      fontSize: Math.round(22 * UI_SCALE) + 'px', color: '#333333', fontFamily: 'sans-serif', fontStyle: 'bold',
      align: 'center',
    }).setOrigin(0.5).setDepth(4).setVisible(false);

    // 创建食物标签（盘子上）
    this.foodLabels = [];
    for (let i = 0; i < 6; i++) {
      const t = this.add.text(0, 0, '', {
        fontSize: Math.round(12 * UI_SCALE) + 'px', color: '#ffffff', fontFamily: 'monospace', fontStyle: 'bold',
      }).setOrigin(0.5).setStroke('#000000', 3);
      this.foodLabels.push(t);
    }

    // 创建队列食物标签（4 队列 × 3 槽位）
    this.queueLabels = [];
    for (let qi = 0; qi < 4; qi++) {
      this.queueLabels[qi] = [];
      for (let fi = 0; fi < 3; fi++) {
        const t = this.add.text(0, 0, '', {
          fontSize: Math.round(11 * UI_SCALE) + 'px', color: '#ffffff', fontFamily: 'monospace', fontStyle: 'bold',
        }).setOrigin(0.5).setStroke('#000000', 3);
        this.queueLabels[qi].push(t);
      }
    }

    // 输入
    this.input.on('pointerdown', this.onPointerDown.bind(this));

    // 道具按钮（洗牌图标）
    this.btnReshuffle = this.makeShuffleButton(CANVAS_W / 2, CANVAS_H - Math.round(30 * UI_SCALE), Math.round(20 * UI_SCALE), 0xe94560)
      .on('pointerdown', () => this.onReshuffle());

    // 再来一局按钮（初始隐藏）
    this.btnRestart = this.makeCartoonButton(CANVAS_W / 2, CANVAS_H / 2 + Math.round(42 * UI_SCALE), '再来一局', 0x27ae60, 18)
      .setDepth(4)
      .on('pointerdown', () => this.resetGame())
      .setVisible(false);

    // 启动
    this.gameInited = false;
    this.dialogShown = false;

    // 开始界面
    this.startOverlay = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x000000, 0.7)
    .setInteractive();

    this.loadingText = this.add.text(CANVAS_W / 2, CANVAS_H / 2 - 60, '正在加载图片...', {
      fontSize: '18px', color: '#888888', fontFamily: 'sans-serif',
    }).setOrigin(0.5);

    this.btnStart = this.makeCartoonButton(CANVAS_W / 2, CANVAS_H / 2, '开始游戏', 0xe94560, 32)
      .setDepth(1).setVisible(false)
      .on('pointerdown', () => {
        this.startOverlay.destroy();
        this.loadingText.destroy();
        this.btnStart.destroy();
        gameRunning = true;
      });

    // 设置按钮（齿轮图标，常驻顶部条右上角）
    this.btnSettings = this.makeGearButton(Math.round(50 * UI_SCALE), CANVAS_H - Math.round(30 * UI_SCALE), Math.round(18 * UI_SCALE), 0x3498db)
      .setDepth(1)
      .on('pointerdown', () => this.openSettings());

    // 设置面板
    this.settingsOverlay = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x000000, 0.7)
      .setVisible(false).setInteractive().setDepth(10);
    this.settingsPanel = this.add.graphics().setDepth(10.5).setVisible(false);
    this.settingsTitle = this.add.text(CANVAS_W / 2, CANVAS_H / 2 - Math.round(145 * UI_SCALE), '棋盘大小', {
      fontSize: Math.round(24 * UI_SCALE) + 'px', color: '#333333', fontFamily: 'sans-serif', fontStyle: 'bold',
    }).setOrigin(0.5).setDepth(11).setVisible(false);
    this.sizeButtons = [];
    [20, 30, 50, 100].forEach((n, i) => {
      const btn = this.makeCartoonButton(CANVAS_W / 2, CANVAS_H / 2 - Math.round(100 * UI_SCALE) + i * Math.round(44 * UI_SCALE), n + '×' + n, 0x3498db, 16)
        .setDepth(11).setVisible(false)
        .on('pointerdown', () => this.applyBoardSize(n));
      this.sizeButtons.push(btn);
    });
    this.btnRestartFromSettings = this.makeCartoonButton(CANVAS_W / 2, CANVAS_H / 2 + Math.round(82 * UI_SCALE), '重新开一局', 0x27ae60, 16)
      .setDepth(11).setVisible(false)
      .on('pointerdown', () => { this.closeSettings(); this.resetGame(); });
    this.btnSettingsClose = this.makeCartoonButton(CANVAS_W / 2, CANVAS_H / 2 + Math.round(126 * UI_SCALE), '关闭', 0x95a5a6, 14)
      .setDepth(11).setVisible(false)
      .on('pointerdown', () => this.closeSettings());

    // 加载随机图片
    this.loadRandomImage();

    // 清盘提示对话框（初始隐藏）
    this.dialogOverlay = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x000000, 0.7)
    .setVisible(false).setInteractive().setDepth(2);

    // 白色圆角面板背景
    this.dialogPanel = this.add.graphics().setDepth(3).setVisible(false);

    this.dialogText = this.add.text(CANVAS_W / 2, CANVAS_H / 2 - Math.round(32 * UI_SCALE), '', {
      fontSize: Math.round(18 * UI_SCALE) + 'px', color: '#333333', fontFamily: 'sans-serif',
      align: 'center',
    }).setOrigin(0.5).setDepth(4).setVisible(false);

    this.dialogConfirm = this.makeCartoonButton(CANVAS_W / 2, CANVAS_H / 2 + Math.round(42 * UI_SCALE), '确定', 0xe94560, 18)
      .setDepth(4).setVisible(false)
      .on('pointerdown', () => this.onClearPlates());

    // 胜利 / 游戏结束弹窗（白色面板 + 再来一局）
    this.victoryOverlay = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x000000, 0.7)
      .setVisible(false).setInteractive().setDepth(2);
    this.victoryPanel = this.add.graphics().setDepth(3).setVisible(false);
  }

  // 卡通风格按钮：圆角胶囊 + 粗描边 + 投影 + 白字黑边
  makeCartoonButton(x, y, label, fill, fontSize) {
    fontSize = Math.round(fontSize * UI_SCALE);
    const padX = fontSize * 1.2;
    const w = label.length * fontSize + padX * 2;
    const h = fontSize + fontSize * 1.3;
    const r = h / 2;
    const border = Math.max(3, Math.round(fontSize / 6));
    const c = this.add.container(x, y);
    const shadow = this.add.graphics();
    shadow.fillStyle(0x000000, 0.22);
    shadow.fillRoundedRect(-w / 2 + 4, -h / 2 + 5, w, h, r);
    const body = this.add.graphics();
    body.fillStyle(fill);
    body.fillRoundedRect(-w / 2, -h / 2, w, h, r);
    body.lineStyle(border, 0x2c3e50, 1);
    body.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
    const t = this.add.text(0, 0, label, {
      fontSize: fontSize + 'px', color: '#ffffff', fontFamily: 'sans-serif', fontStyle: 'bold',
    }).setOrigin(0.5).setStroke('#2c3e50', Math.max(2, Math.round(fontSize / 10)));
    c.add([shadow, body, t]);
    c.setSize(w, h);
    c.setInteractive({
      hitArea: new Phaser.Geom.Rectangle(0, 0, w, h),
      hitAreaCallback: Phaser.Geom.Rectangle.Contains,
      useHandCursor: true,
    });
    return c;
  }

  // 齿轮图标按钮：主体圆 + 8 个齿 + 白色中心孔
  makeGearButton(x, y, r, fill) {
    const size = Math.round(r * 2.7);
    const c = this.add.container(x, y);
    const shadow = this.add.graphics();
    shadow.fillStyle(0x000000, 0.22);
    shadow.fillCircle(4, 5, r * 1.35);
    const body = this.add.graphics();
    body.fillStyle(fill);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      body.fillCircle(Math.cos(a) * r, Math.sin(a) * r, r * 0.32);
    }
    body.fillCircle(0, 0, r);
    body.lineStyle(Math.max(2, Math.round(2 * UI_SCALE)), 0x2c3e50, 1);
    body.strokeCircle(0, 0, r);
    body.fillStyle(0xffffff);
    body.fillCircle(0, 0, r * 0.42);
    c.add([shadow, body]);
    c.setSize(size, size);
    c.setInteractive({
      hitArea: new Phaser.Geom.Rectangle(0, 0, size, size),
      hitAreaCallback: Phaser.Geom.Rectangle.Contains,
      useHandCursor: true,
    });
    return c;
  }

  // 洗牌图标按钮：圆底 + 两条交叉白色箭头
  makeShuffleButton(x, y, r, fill) {
    const size = Math.round(r * 2.7);
    const c = this.add.container(x, y);
    const shadow = this.add.graphics();
    shadow.fillStyle(0x000000, 0.22);
    shadow.fillCircle(4, 5, r * 1.35);
    const body = this.add.graphics();
    body.fillStyle(fill);
    body.fillCircle(0, 0, r);
    body.lineStyle(Math.max(2, Math.round(2 * UI_SCALE)), 0x2c3e50, 1);
    body.strokeCircle(0, 0, r);
    const d = r * 0.55;
    const lw = Math.max(3, Math.round(3 * UI_SCALE));
    const head = r * 0.42;
    // 箭头 1：左下 → 右上
    this.drawArrow(body, -d, d, d, -d, lw, head);
    // 箭头 2：左上 → 右下
    this.drawArrow(body, -d, -d, d, d, lw, head);
    c.add([shadow, body]);
    c.setSize(size, size);
    c.setInteractive({
      hitArea: new Phaser.Geom.Rectangle(0, 0, size, size),
      hitAreaCallback: Phaser.Geom.Rectangle.Contains,
      useHandCursor: true,
    });
    return c;
  }

  // 在 Graphics 上画一条带三角形箭头的线段
  drawArrow(g, x1, y1, x2, y2, lineWidth, headLen) {
    g.lineStyle(lineWidth, 0xffffff, 1);
    g.lineBetween(x1, y1, x2, y2);
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const a1 = ang + Math.PI * 0.85;
    const a2 = ang - Math.PI * 0.85;
    g.fillStyle(0xffffff);
    g.fillTriangle(
      x2, y2,
      x2 + Math.cos(a1) * headLen, y2 + Math.sin(a1) * headLen,
      x2 + Math.cos(a2) * headLen, y2 + Math.sin(a2) * headLen
    );
  }

  update(time, delta) {
    // 使用 Phaser 原生帧循环，delta 为距上一帧的毫秒数
    this.onUpdate(delta);
  }

  onUpdate(delta) {
    // 归一化到 16.67ms（约 60fps）基准，使移动速度与帧率无关
    const dt = (delta || 16.67) / 16.67;
    window.__UPDATE_COUNT = (window.__UPDATE_COUNT || 0) + 1;
    if (!gameRunning || !this.gameInited) return;

    // 更新移动动物
    let needsBFS = false;
    for (let i = movingAnimals.length - 1; i >= 0; i--) {
      const a = movingAnimals[i];
      if (a.done) {
        // 吃饱后立即消失，无飞离动画
        movingAnimals.splice(i, 1);
        needsBFS = true;
      } else if (a.path.length > 0) {
        // 连续坐标移动：朝下一个路径点直线前进，速度为像素/帧
        const next = a.path[0];
        const tx = BOARD_MARGIN + next.col * CELL + CELL / 2;
        const ty = TOP_MARGIN + next.row * CELL + CELL / 2;
        const dx = tx - a.x, dy = ty - a.y;
        const dist = Math.hypot(dx, dy);
        const step = a.speed * dt;
        if (dist <= step) {
          a.x = tx; a.y = ty;
          a.path.shift();
          if (next.isFood) this.arriveAtFood(a);
        } else {
          a.x += dx / dist * step;
          a.y += dy / dist * step;
        }
      }
    }
    // 飞行中的食物：从队列槽位直线飞到盘子
    for (let i = flyingFoods.length - 1; i >= 0; i--) {
      const food = flyingFoods[i];
      food.t += 0.08 * dt;
      if (food.t >= 1) {
        food.t = 1;
        food.flying = false;
        food.active = true;
        flyingFoods.splice(i, 1);
        triggerBFS();
      } else {
        const cx = BOARD_MARGIN + PLATE_COLS[food.plateIndex] * CELL;
        const cy = UI_Y + 6 + plateRadius();
        food.fx = food.fromX + (cx - food.fromX) * food.t;
        food.fy = food.fromY + (cy - food.fromY) * food.t;
      }
    }
    if (needsBFS) triggerBFS();
    // 只重绘本帧离场的格子（脏格），棋盘其余部分复用离屏纹理
    if (dirtyCells.length > 0) {
      for (const d of dirtyCells) this.paintBlankCell(d.row, d.col);
      this.boardTex.refresh();   // 批量重绘后一次性刷新纹理
      dirtyCells.length = 0;
    }
    this.renderAnimals();
    this.drawUI();
    // 检查是否所有盘子满了且无动物可吸引
    this.checkFullPlates();
    this.checkGameOver();
  }

  // ============ 绘制 ============
  // 将静态棋盘一次性烘焙到离屏 Canvas 纹理（boardTex），由 boardImg 展示。
  // 动物离场时只重绘对应单格，避免每帧 clear + 全量 fillRect。
  drawGrid() {
    if (this.boardImg) { this.boardImg.destroy(); this.boardImg = null; }
    if (this.boardTex) { this.boardTex.destroy(); this.boardTex = null; }

    const bw = COLS * CELL, bh = ROWS * CELL;
    this.boardTex = this.textures.createCanvas('board', bw, bh);
    const ctx = this.boardTex.context;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        this.paintCell(ctx, r, c);
      }
    }
    this.boardTex.refresh();
    this.boardImg = this.add.image(BOARD_MARGIN, TOP_MARGIN, 'board').setOrigin(0, 0).setDepth(-0.5);
  }

  // 在指定 2d 上下文上绘制单格（纹理坐标，无棋盘边距）
  paintCell(ctx, r, c) {
    const v = grid[r][c];
    const x = c * CELL, y = r * CELL;
    if (v === -1) {
      ctx.fillStyle = '#e8e8e8';
      ctx.fillRect(x, y, CELL, CELL);
    } else {
      ctx.fillStyle = '#' + COLORS[v].toString(16).padStart(6, '0');
      ctx.fillRect(x, y, CELL, CELL);
      // 极淡格线，辅助辨认格子边界但不破坏图案
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
    }
  }

  // 动物离场后把单格重绘为空白（仅写入离屏上下文，不单独刷新纹理）
  paintBlankCell(r, c) {
    if (!this.boardTex) return;
    const ctx = this.boardTex.context;
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
  }

  // 生成木纹纹理（只生成一次）
  makeWoodTexture() {
    const key = 'wood';
    if (this.textures.exists(key)) return key;
    const size = 128;
    const tex = this.textures.createCanvas(key, size, size);
    const ctx = tex.context;
    ctx.fillStyle = '#a9743f';
    ctx.fillRect(0, 0, size, size);
    for (let i = 0; i < 14; i++) {
      const baseX = i * 9;
      ctx.strokeStyle = i % 2 ? '#8b5a2b' : '#6b3e1f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let y = 0; y <= size; y += 4) {
        const x = baseX + Math.sin(y * 0.05 + i) * 3;
        if (y === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    tex.refresh();
    return key;
  }

  // 布局木纹边框（棋盘尺寸变化后调用）
  layoutWoodBorder() {
    if (!this.borderTiles) return;
    const T = Math.round(12 * UI_SCALE);
    const bw = COLS * CELL;
    const bh = ROWS * CELL;
    const x = BOARD_MARGIN - T;
    const y = TOP_MARGIN - T;
    this.borderTiles[0].setPosition(x, y).setSize(bw + 2 * T, T);          // 上
    this.borderTiles[1].setPosition(x, y + T + bh).setSize(bw + 2 * T, T); // 下
    this.borderTiles[2].setPosition(x, y + T).setSize(T, bh);              // 左
    this.borderTiles[3].setPosition(x + T + bw, y + T).setSize(T, bh);     // 右
  }

  renderAnimals() {
    const g = this.animalGfx;
    g.clear();
    const AS = Math.max(4, Math.round(CELL * 0.75));
    for (const a of movingAnimals) {
      if (a.path.length > 0) {
        const px = a.x - AS / 2;
        const py = a.y - AS / 2;
        g.fillStyle(COLORS[a.color]);
        g.fillRect(px, py, AS, AS);
      }
    }
  }

  drawUI() {
    const g = this.uiGfx;
    g.clear();
    const FOOD_SIZE = Math.round(56 * UI_SCALE);
    const PLATE_R = plateRadius();
    const Q_SPACING = (CANVAS_W - 2 * BOARD_MARGIN) / 4;
    const Q_START_Y = UI_Y + 6 + 2 * PLATE_R + Math.round(12 * UI_SCALE);

    // 盘子（圆形，带盘沿）
    for (let i = 0; i < 6; i++) {
      const cx = BOARD_MARGIN + PLATE_COLS[i] * CELL;
      const cy = UI_Y + 6 + PLATE_R;
      const food = this.plates[i];
      if (food && !food.flying) {
        this.foodLabels[i].setVisible(true);
        g.fillStyle(COLORS[food.color]);
        g.fillCircle(cx, cy, PLATE_R);
        // 盘沿描边
        g.lineStyle(Math.max(2, Math.round(2 * UI_SCALE)), 0x2c3e50, 1);
        g.strokeCircle(cx, cy, PLATE_R);
        this.foodLabels[i].setPosition(cx, cy);
        this.foodLabels[i].setText(String(food.remaining));
      } else {
        this.foodLabels[i].setVisible(false);
        g.lineStyle(1, 0x999999);
        g.strokeCircle(cx, cy, PLATE_R);
      }
    }

    // 飞行中的食物（从队列槽位飞向盘子）
    for (const food of flyingFoods) {
      g.fillStyle(COLORS[food.color]);
      g.fillRoundedRect(food.fx - FOOD_SIZE / 2, food.fy - FOOD_SIZE / 2, FOOD_SIZE, FOOD_SIZE, 4);
    }

    // 队列
    for (let qi = 0; qi < 4; qi++) {
      const qx = BOARD_MARGIN + qi * Q_SPACING + Q_SPACING / 2 - FOOD_SIZE / 2;
      const queue = this.queues[qi];
      for (let fi = 0; fi < 2; fi++) {
        const fy = Q_START_Y + fi * (FOOD_SIZE + 4);
        const label = this.queueLabels[qi][fi];
        if (fi < queue.length) {
          const food = queue[fi];
          g.fillStyle(COLORS[food.color]);
          g.fillRoundedRect(qx, fy, FOOD_SIZE, FOOD_SIZE, 4);
          label.setVisible(true).setPosition(qx + FOOD_SIZE / 2, fy + FOOD_SIZE / 2);
          label.setText(String(food.capacity));
        } else {
          label.setVisible(false);
        }
      }
    }
  }

  // ============ 交互 ============
  onPointerDown(pointer) {
    // 遮罩层（清盘对话框 / 设置面板）打开时，屏蔽棋盘交互
    if (this.dialogShown || this.settingsOverlay.visible) return;
    const x = pointer.x;
    const y = pointer.y;
    const FOOD_SIZE = Math.round(56 * UI_SCALE);
    const Q_SPACING = (CANVAS_W - 2 * BOARD_MARGIN) / 4;
    const PLATE_R = plateRadius();
    const Q_START_Y = UI_Y + 6 + 2 * PLATE_R + Math.round(12 * UI_SCALE);

    if (y >= Q_START_Y && y < Q_START_Y + 2 * (FOOD_SIZE + 4)) {
      for (let qi = 0; qi < 4; qi++) {
        const qx = BOARD_MARGIN + qi * Q_SPACING + Q_SPACING / 2 - FOOD_SIZE / 2;
        if (x >= qx && x < qx + FOOD_SIZE) {
          this.onQueueClick(qi);
          return;
        }
      }
    }
  }

  onQueueClick(qi) {
    const emptyIdx = this.nearestEmptyPlate(qi);
    if (emptyIdx === -1) return;
    const food = this.queues[qi].shift();
    if (!food) return;
    food.plateIndex = emptyIdx;
    food.plateCol = PLATE_COLS[emptyIdx];
    food.seq = foodSeq++;
    food.active = false;      // 飞到盘子后再激活
    food.flying = true;
    const FOOD_SIZE = Math.round(56 * UI_SCALE);
    const Q_SPACING = (CANVAS_W - 2 * BOARD_MARGIN) / 4;
    const Q_START_Y = UI_Y + 6 + 2 * plateRadius() + Math.round(12 * UI_SCALE);
    food.fromX = BOARD_MARGIN + qi * Q_SPACING + Q_SPACING / 2;
    food.fromY = Q_START_Y + FOOD_SIZE / 2;
    food.fx = food.fromX;
    food.fy = food.fromY;
    food.t = 0;
    this.plates[emptyIdx] = food;   // 预占空盘，避免被其他队列选中
    flyingFoods.push(food);
  }

  // 选择离队列水平位置最近的空盘（替代从左到右的第一个空盘）
  nearestEmptyPlate(qi) {
    const Q_SPACING = (CANVAS_W - 2 * BOARD_MARGIN) / 4;
    const qx = BOARD_MARGIN + qi * Q_SPACING + Q_SPACING / 2;
    let best = -1, bestD = Infinity;
    for (let i = 0; i < this.plates.length; i++) {
      if (this.plates[i] !== null) continue;
      const px = BOARD_MARGIN + PLATE_COLS[i] * CELL;
      const d = Math.abs(px - qx);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  onReshuffle() {
    // 遮罩层打开时重排无效
    if (this.dialogShown || this.settingsOverlay.visible) return;
    const allFoods = [];
    for (const q of this.queues) allFoods.push(...q.splice(0));
    shuffle(allFoods);
    const newQueues = [[], [], [], []];
    for (let i = 0; i < allFoods.length; i++) newQueues[i % 4].push(allFoods[i]);
    this.queues.length = 0;
    this.queues.push(...newQueues);
  }

  arriveAtFood(animal) {
    const food = animal.targetFood;
    if (food && food.active) {
      food.remaining--;
      food.attracted--;
      if (food.remaining <= 0) {
        food.active = false;
        this.plates[food.plateIndex] = null;
      }
    }
    animal.done = true;
  }

  checkFullPlates() {
    if (this.dialogShown) return;
    // 6 个盘子都满，且无动物在移动，且无动物可吸引
    const allFull = this.plates.every(p => p !== null);
    if (!allFull || movingAnimals.length > 0) return;
    const canAttract = this.plates.some(p => plateBFS[p.plateIndex].hasAnimals(p.color));
    if (canAttract) return;
    // 弹出清盘提示
    this.showDialog();
  }

  showDialog() {
    this.dialogShown = true;
    this.dialogOverlay.setVisible(true);
    this.drawDialogPanel();
    this.dialogPanel.setVisible(true);
    this.dialogText.setText('6 个盘子已满，是否清空前三个盘子\n并将食物放回队列？').setVisible(true);
    this.dialogConfirm.setVisible(true);
  }

  // 绘制白色圆角面板（投影 + 主体 + 粗描边），居中，宽 w 高 h
  drawPanel(g, w, h) {
    g.clear();
    const x = CANVAS_W / 2 - w / 2;
    const y = CANVAS_H / 2 - h / 2;
    // 投影
    g.fillStyle(0x000000, 0.22);
    g.fillRoundedRect(x + 4, y + 5, w, h, 16);
    // 面板主体
    g.fillStyle(0xffffff, 1);
    g.fillRoundedRect(x, y, w, h, 16);
    // 粗描边
    g.lineStyle(Math.max(3, Math.round(3 * UI_SCALE)), 0x2c3e50, 1);
    g.strokeRoundedRect(x, y, w, h, 16);
  }

  drawDialogPanel() {
    this.drawPanel(this.dialogPanel, Math.round(360 * UI_SCALE), Math.round(150 * UI_SCALE));
  }

  drawVictoryPanel() {
    this.drawPanel(this.victoryPanel, Math.round(360 * UI_SCALE), Math.round(150 * UI_SCALE));
  }

  hideDialog() {
    this.dialogShown = false;
    this.dialogOverlay.setVisible(false);
    this.dialogPanel.setVisible(false);
    this.dialogText.setVisible(false);
    this.dialogConfirm.setVisible(false);
  }

  onClearPlates() {
    // 清空前三个盘子，食物放回队列
    for (let i = 0; i < 3; i++) {
      const food = this.plates[i];
      if (food) {
        food.active = false;
        food.plateIndex = -1;
        food.attracted = 0;
        // 放回队列末尾
        this.queues[i % 4].push(food);
        this.plates[i] = null;
      }
    }
    this.hideDialog();
    // 新食物上盘后重新触发 BFS
    triggerBFS();
  }

  checkGameOver() {
    const allQueuesEmpty = this.queues.every(q => q.length === 0);
    const allPlatesEmpty = this.plates.every(p => p === null);
    const hasAnimals = remainingAnimals > 0;

    if (allQueuesEmpty && allPlatesEmpty && !hasAnimals && movingAnimals.length === 0) {
      this.msgText.setText('胜利! 所有动物都吃饱了!').setVisible(true);
      this.victoryOverlay.setVisible(true);
      this.drawVictoryPanel();
      this.victoryPanel.setVisible(true);
      this.btnReshuffle.setVisible(false);
      this.btnRestart.setVisible(true);
      gameRunning = false;
    } else if (allQueuesEmpty && allPlatesEmpty && hasAnimals && movingAnimals.length === 0) {
      this.msgText.setText('游戏结束! 还有动物没被消除。').setVisible(true);
      this.victoryOverlay.setVisible(true);
      this.drawVictoryPanel();
      this.victoryPanel.setVisible(true);
      this.btnReshuffle.setVisible(false);
      this.btnRestart.setVisible(true);
      gameRunning = false;
    }
  }

  resetGame() {
    // 隐藏结算态 UI，恢复游戏按钮
    this.msgText.setVisible(false);
    this.victoryOverlay.setVisible(false);
    this.victoryPanel.setVisible(false);
    this.btnRestart.setVisible(false);
    this.btnReshuffle.setVisible(true);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      this.currentImg = img;
      processImage(img);
      this.scale.resize(CANVAS_W, CANVAS_H);
      this.layoutUI();
      this.initGame();
      this.drawGrid();
      this.drawUI();
      gameRunning = true;
    };
    img.onerror = () => {
      generateGrid();
      this.initGame();
      this.drawGrid();
      this.drawUI();
      gameRunning = true;
    };
    img.src = randomDiceBearUrl();
  }

  loadRandomImage() {
    this.loadingText.setVisible(true);
    this.btnStart.setVisible(false);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      this.currentImg = img;
      processImage(img);
      this.scale.resize(CANVAS_W, CANVAS_H);
      this.layoutUI();
      this.initGame();
      this.drawGrid();
      this.drawUI();
      this.loadingText.setVisible(false);
      this.btnStart.setVisible(true);
    };
    img.onerror = () => {
      this.loadingText.setText('图片加载失败，使用默认棋盘');
      this.initGame();
      this.drawGrid();
      this.drawUI();
      this.loadingText.setVisible(false);
      this.btnStart.setVisible(true);
    };
    img.src = randomDiceBearUrl();
  }

  initGame() {
    const animalCounts = countAnimals();
    const allFoods = generateFoods(animalCounts);
    this.queues = distributeToQueues(allFoods);
    this.plates = Array(6).fill(null);
    queues = this.queues;
    plates = this.plates;
    this.gameInited = true;
    this.dialogShown = false;
    movingAnimals.length = 0;
    flyingFoods.length = 0;
    remainingAnimals = ROWS * COLS;
    dirtyCells.length = 0;
    plateBFS = [];
    for (let i = 0; i < 6; i++) {
      plateBFS[i] = new BFS(grid, ROWS, COLS, BLANK_ROWS, COLORS.length, PLATE_COLS[i]);
    }
  }

  // 画布尺寸可能已变，重排所有按钮/遮罩/面板位置
  layoutUI() {
    this.btnReshuffle.setPosition(CANVAS_W / 2, CANVAS_H - Math.round(30 * UI_SCALE));
    this.btnRestart.setPosition(CANVAS_W / 2, CANVAS_H / 2 + Math.round(42 * UI_SCALE));
    this.btnStart.setPosition(CANVAS_W / 2, CANVAS_H / 2);
    this.loadingText.setPosition(CANVAS_W / 2, CANVAS_H / 2 - 60);
    this.msgText.setPosition(CANVAS_W / 2, CANVAS_H / 2 - Math.round(32 * UI_SCALE));
    if (this.startOverlay && this.startOverlay.active) {
      this.startOverlay.setPosition(CANVAS_W / 2, CANVAS_H / 2);
      this.startOverlay.setSize(CANVAS_W, CANVAS_H);
    }
    this.dialogOverlay.setPosition(CANVAS_W / 2, CANVAS_H / 2);
    this.dialogOverlay.setSize(CANVAS_W, CANVAS_H);
    this.dialogText.setPosition(CANVAS_W / 2, CANVAS_H / 2 - Math.round(32 * UI_SCALE));
    this.dialogConfirm.setPosition(CANVAS_W / 2, CANVAS_H / 2 + Math.round(42 * UI_SCALE));
    this.victoryOverlay.setPosition(CANVAS_W / 2, CANVAS_H / 2);
    this.victoryOverlay.setSize(CANVAS_W, CANVAS_H);
    this.btnSettings.setPosition(Math.round(50 * UI_SCALE), CANVAS_H - Math.round(30 * UI_SCALE));
    this.settingsOverlay.setPosition(CANVAS_W / 2, CANVAS_H / 2);
    this.settingsOverlay.setSize(CANVAS_W, CANVAS_H);
    this.settingsTitle.setPosition(CANVAS_W / 2, CANVAS_H / 2 - Math.round(145 * UI_SCALE));
    this.sizeButtons.forEach((btn, i) => btn.setPosition(CANVAS_W / 2, CANVAS_H / 2 - Math.round(100 * UI_SCALE) + i * Math.round(44 * UI_SCALE)));
    this.btnRestartFromSettings.setPosition(CANVAS_W / 2, CANVAS_H / 2 + Math.round(82 * UI_SCALE));
    this.btnSettingsClose.setPosition(CANVAS_W / 2, CANVAS_H / 2 + Math.round(126 * UI_SCALE));
    this.layoutWoodBorder();
  }

  openSettings() {
    this.settingsOverlay.setVisible(true);
    this.drawPanel(this.settingsPanel, Math.round(240 * UI_SCALE), Math.round(360 * UI_SCALE));
    this.settingsPanel.setVisible(true);
    this.settingsTitle.setVisible(true);
    this.sizeButtons.forEach(b => b.setVisible(true));
    this.btnRestartFromSettings.setVisible(true);
    this.btnSettingsClose.setVisible(true);
  }

  closeSettings() {
    this.settingsOverlay.setVisible(false);
    this.settingsPanel.setVisible(false);
    this.settingsTitle.setVisible(false);
    this.sizeButtons.forEach(b => b.setVisible(false));
    this.btnRestartFromSettings.setVisible(false);
    this.btnSettingsClose.setVisible(false);
  }

  applyBoardSize(n) {
    BOARD_MAX_DIM = n;
    this.closeSettings();
    if (!this.currentImg) return;
    processImage(this.currentImg);
    this.scale.resize(CANVAS_W, CANVAS_H);
    this.layoutUI();
    this.initGame();
    this.drawGrid();
    this.drawUI();
  }
}

// ============ 图片处理 ============
function processImage(img) {
  // 计算棋盘尺寸：最长边不超过 BOARD_MAX_DIM，保持比例
  const maxDim = BOARD_MAX_DIM;
  let w = img.width, h = img.height;
  if (w > maxDim || h > maxDim) {
    const scale = Math.min(maxDim / w, maxDim / h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  COLS = Math.max(1, Math.min(w, maxDim));
  ROWS = Math.max(1, Math.min(h, maxDim));
  // 格子大小随列数缩放，保持棋盘宽度约 TARGET_W 像素
  CELL = Math.max(4, Math.round(TARGET_W / COLS));
  CANVAS_W = COLS * CELL + 2 * BOARD_MARGIN;
  CANVAS_H = TOP_MARGIN + (ROWS + BLANK_ROWS) * CELL + Math.round(290 * UI_SCALE);
  UI_Y = TOP_MARGIN + (ROWS + BLANK_ROWS) * CELL;
  // 6 个盘子沿棋盘宽度均匀分布
  PLATE_COLS = [];
  for (let i = 0; i < 6; i++) PLATE_COLS[i] = Math.round(COLS * (i + 0.5) / 6);

  // 将图片缩放到棋盘尺寸，提取像素
  const cvs = document.createElement('canvas');
  cvs.width = COLS;
  cvs.height = ROWS;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(img, 0, 0, COLS, ROWS);
  const data = ctx.getImageData(0, 0, COLS, ROWS).data;

  // 收集所有像素颜色（仅用于布局映射，不改变调色板）
  const pixels = [];
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    pixels.push((r << 16) | (g << 8) | b);
  }

  // 将每个像素映射到最近的固定彩虹色（COLORS 保持默认，不随图片改变）
  function colorDist(r, g, b, key) {
    const dr = r - ((key >> 16) & 0xff);
    const dg = g - ((key >> 8) & 0xff);
    const db = b - (key & 0xff);
    return dr*dr + dg*dg + db*db;
  }
  grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const key = pixels[r * COLS + c];
      let best = 0, bestDist = Infinity;
      for (let i = 0; i < COLORS.length; i++) {
        const d = colorDist((key>>16)&0xff, (key>>8)&0xff, key&0xff, COLORS[i]);
        if (d < bestDist) { bestDist = d; best = i; }
      }
      grid[r][c] = best;
    }
  }
}
const config = {
  type: Phaser.AUTO,
  width: CANVAS_W,
  height: CANVAS_H,
  backgroundColor: '#e8e8e8',
  scene: GameScene,
  parent: 'game',
};

const game = new Phaser.Game(config);
window.__GAME = game;
</script>
