<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelPets 小游戏合集</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  color: #fff;
}
h1 {
  font-size: 2.4rem;
  font-weight: 800;
  margin-bottom: 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  letter-spacing: 2px;
}
.subtitle {
  font-size: 1rem;
  opacity: 0.85;
  margin-bottom: 40px;
}
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
  max-width: 960px;
  width: 100%;
}
.game-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 28px 24px;
  text-decoration: none;
  color: #fff;
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.game-card:hover {
  transform: translateY(-6px);
  background: rgba(255,255,255,0.22);
  box-shadow: 0 12px 28px rgba(0,0,0,0.25);
}
.game-icon {
  font-size: 3rem;
  line-height: 1;
}
.game-title {
  font-size: 1.4rem;
  font-weight: 700;
}
.game-desc {
  font-size: 0.92rem;
  opacity: 0.9;
  line-height: 1.5;
}
.game-tag {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 10px;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.2);
  border-radius: 12px;
  align-self: flex-start;
}
footer {
  margin-top: 50px;
  font-size: 0.85rem;
  opacity: 0.7;
}
@media (max-width: 600px) {
  h1 { font-size: 1.8rem; }
  .games { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<h1>PixelPets 小游戏</h1>
<p class="subtitle">三款随手小游戏，点开即玩</p>

<div class="games">
  <a class="game-card" href="animal-elimination.html">
    <div class="game-icon">🐾</div>
    <div class="game-title">动物消除</div>
    <div class="game-desc">图片转棋盘，用 BFS 寻路把动物喂饱。支持自定义棋盘大小、倍速、一键重排。</div>
    <span class="game-tag">Phaser 4</span>
  </a>

  <a class="game-card" href="express-delivery.html">
    <div class="game-icon">📦</div>
    <div class="game-title">快递哪去了</div>
    <div class="game-desc">10x10 逻辑推理：每行每列每种颜色只有一个快递，快递互不相邻。</div>
    <span class="game-tag">Phaser 3</span>
  </a>

  <a class="game-card" href="GemMatch.html">
    <div class="game-icon">✨</div>
    <div class="game-title">消消乐</div>
    <div class="game-desc">经典三消，可自定义倒计时（1-15 分钟），带暂停、连击、最高分记录。</div>
    <span class="game-tag">纯 DOM</span>
  </a>
</div>

<footer>PixelPets</footer>
</body>
</html>
